name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cronos-launchpad/core test
      - run: pnpm --filter @cronos-launchpad/web test
      - run: pnpm --filter @cronos-launchpad/web build
      - run: pnpm --filter @cronos-launchpad/indexer test
      - run: pnpm --filter @cronos-launchpad/indexer build
      - run: pnpm --filter @cronos-launchpad/contracts test
      - run: pnpm audit --audit-level high
